services:
  translator:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: booktranslator-translator-1
    # Run as the host user so files written into ./processed are owned by
    # you, not root. GPU access is preserved via group_add (video/render).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    # Backend selection (BACKEND_MODE / LLAMA_BACKEND / REMOTE_*). Editing
    # backend.env + `docker compose up -d` recreates the container with the
    # new values -- no image rebuild. See backend.env.example.
    env_file:
      - backend.env
    environment:
      - HSA_OVERRIDE_GFX_VERSION=12.0.1
      - HIP_VISIBLE_DEVICES=0
      - ROCR_VISIBLE_DEVICES=0
      - MODEL_NAME=qwen2.5:7b-instruct-q6_K
      - MODEL_PATH=/models/Qwen2.5-7B-Instruct-Q6_K.gguf
      - VLM_MODEL_PATH=/models/allenai_olmOCR-2-7B-1025-Q6_K.gguf
      - VLM_MMPROJ_PATH=/models/mmproj-allenai_olmOCR-2-7B-1025-f16.gguf
      - TESSDATA_PREFIX=/usr/share/tesseract-ocr/5/tessdata
    volumes:
      - ~/llm_models:/models
      - ./books:/data/books:ro
      - ./processed:/data/processed
      - ./pipeline:/host_scripts:ro
      - ./pipeline:/app:ro
      # Persist the GPU shader / kernel cache across container recreation.
      # RADV (Vulkan) compiles every pipeline on the first llama-server
      # load and caches it under ~/.cache/mesa_shader_cache (+ radv_builtin
      # _shaders); on the ephemeral overlay layer that ~2-3 min cold compile
      # is paid again after every `compose up -d` that recreates the
      # container. A named volume makes it a one-time cost. Backend-agnostic:
      # also covers ~/.cache/comgr etc. if LLAMA_BACKEND switches to a rocm
      # build. HOME is /home/ubuntu (image user ubuntu:1000).
      - llama-cache:/home/ubuntu/.cache
    ports:
      - "11434:11434"
      - "11435:11435"
    networks:
      - ai-net
    deploy:
      resources:
        limits:
          memory: 28G
        reservations:
          memory: 20G
    shm_size: '4gb'
    # On-demand batch pipeline, not a service: up only when you run a book.
    # "no" also means a crash stays visible instead of being papered over by
    # an auto-restart (see docs/STATUS.md -- this previously hid a real
    # PID-1 container-bounce bug).
    restart: "no"

networks:
  ai-net:
    external: true

volumes:
  llama-cache:

[[term]]
id = "tempi-count"
check = "retry"
kind = "translate"
source = ["tempo"]
never = ["time", "time-hit"]
# the check: only where the source counts tempi, and only a counted "time" / "time-hit" / "tempos"
check_source_re = '''(?i)\b(?:(?:un|uno|due|tre|quattro|cinque|sei|primo|secondo|terzo|quarto|ultimo|solo|[1-6]|i{1,3}|iv|v)\.?\s+temp[oi]\b|temp[oi]\s+solo\b)'''
never_re = '''(?i)\b(?:one|two|three|four|five|six|first|second|third|fourth|last|single|[1-6]|i{1,3}|iv|v)\.?\s+(?:time-hits?|times?|tempos)\b|\btempos\b'''
line = '''tempi, the actions ("tempi semplici", "tempi al braccio") → time-hits; but tempo / tempi COUNTING the movements of an action ("in due tempi", "composte di tre tempi", "al primo tempo", "in un tempo solo", step labels "I. Tempo", "Primo tempo. —") → tempo / tempi ("in two tempi", "composed of three tempi", "on the first tempo", "I. TEMPO"), never "time" or "time-hit"'''


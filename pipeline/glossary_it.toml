[[term]]
id = "colpo"
check = "retry"
kind = "translate"
source = ["colpo", "urto", "arresto"]
never = ["blow"]
line = '''colpo: the strike itself → hit; the whole offensive action → attack ("colpi semplici" → simple attacks); NEVER "blow" (urto, an impact of blade on blade → knock). Named colpi keep their own names: colpo di punta → thrust, colpo di taglio → cut, colpo dritto / diritto / diretto → straight thrust, colpo di tempo → time-hit, colpo d'arresto / arresto → stop-hit.'''


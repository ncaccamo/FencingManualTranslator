# French term decisions, one [[term]] per decision. Read by pipeline/_glossary_table.py.
# Written 2026-11-11 from translation_prompt.txt; the wording of every "line" is the prompt's own.
#
#   id      a short name, unique in this file
#   kind    keep       left in French, in <i>…</i>          (prompt rule 2)
#           translate  translated, plain text              (rule 3)
#           footnote   translated, "Fr. original" note at first use (rule 3b)
#           note       not a term: a heading or remark sent with its group's entries
#   with    on a note: the kind of entry it is sent with
#   group   "ordinary" for ordinary words the model misreads; fencing terms have none
#   source  the French forms that put this entry in a page's prompt. Matched as whole words,
#           any case, accents optional, common endings allowed; "tir*" = any word starting "tir"
#   source_re  a regular expression on the page's text, where a word list is not enough
#   english on a kept term: how it is written in the English, as a word start
#           ("ripost" finds riposte, riposted); accents count ("doublé" is not "double")
#   never   English forms the line forbids (for the checks; shown to the model through "line")
#   never_re         a pattern for the forbidden English, where the words alone are too common
#   check_source_re  the check runs only where this pattern is in the source (narrower than "source")
#   check   "retry": step 2 checks the page after translation (a forbidden form present, a kept
#           term missing), asks once more with the rule named, and records the page for the
#           review report if that does not mend it. Left out = no check. Set it only for an
#           entry evals/glossary_score.py shows to be safe: a check that fires on pages a
#           reviewer passed costs a wasted retry on every such page
#   The code's own lists are built from these (pipeline/_glossary_fr.py, _glossary_it.py):
#   forms        on a footnoted term: [source form, English] pairs the code translates when the
#                model left the word in the source language, adding the first-use note; a third
#                item is the word the note is written under ("barrés" under "barré")
#   refs         more [form, word noted under] pairs, for notes the model writes itself
#   model_notes  footnoted terms left to the model (ordinary words elsewhere: the code must not
#                rewrite them); its note is accepted as a source reference
#   not_before   [form, pattern]: the form is not the fencing term before this ("froissement
#                d'amour-propre")
#   enforce      on a kept term: [term, [wrong English renderings]] the code puts back in
#                italics and snaps the wrong renderings to
#   line    what the model is told, word for word

